[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volsurfacelab"
version = "0.1.0"
description = "Arbitrage-Aware Volatility Surface & Local-Risk Engine"
readme = "README.md"
authors = [
    { name = "VolSurfaceLab Team" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.75.0",
]
visualization = [
    "plotly>=5.14.0",
    "streamlit>=1.22.0",
]
all = [
    "volsurfacelab[dev,visualization]",
]

[project.scripts]
volsurfacelab = "volsurfacelab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "regression: Regression and adversarial tests",
    "slow: Tests taking more than 5 seconds",
]
